<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Assistant Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 40%, #e3f2fd 100%);
    min-height: 100vh;
    
    position: relative;
  }

  /* Decorative background elements */
  .bg-sun {
    position: fixed; top: 30px; right: 60px;
    width: 80px; height: 80px;
    background: radial-gradient(circle, #ffe082, #ffca28);
    border-radius: 50%;
    box-shadow: 0 0 40px #ffca2880;
    animation: sunPulse 4s ease-in-out infinite;
    z-index: 0;
  }
  .bg-sun::before {
    content: '';
    position: absolute; inset: -20px;
    background: radial-gradient(circle, #ffca2820, transparent 70%);
    border-radius: 50%;
  }
  @keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  .bg-cloud {
    position: fixed;
    background: white;
    border-radius: 40px;
    opacity: 0.7;
    z-index: 0;
  }
  .cloud1 { top: 60px; left: 80px; width: 120px; height: 40px; animation: drift 18s linear infinite; }
  .cloud2 { top: 100px; left: 300px; width: 90px; height: 30px; animation: drift 25s linear infinite 5s; }
  @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(20px)} }

  .bg-hills {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 200px; z-index: 0;
    background: linear-gradient(180deg, transparent, #a5d6a7 60%, #81c784);
    clip-path: ellipse(60% 100% at 50% 100%);
  }

  /* Floating mascot */
  #mascot {
    position: fixed;
    z-index: 100;
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.18));
  }
  #mascot:hover { transform: scale(1.08) rotate(-3deg); }
  #mascot.bounce { animation: bounce 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bounce { 0%{transform:scale(1)} 40%{transform:scale(0.88)} 100%{transform:scale(1)} }
  #mascot.wiggle { animation: wiggle 0.6s ease; }
  @keyframes wiggle {
    0%,100%{transform:rotate(0deg)}
    20%{transform:rotate(-8deg)}
    40%{transform:rotate(8deg)}
    60%{transform:rotate(-5deg)}
    80%{transform:rotate(5deg)}
  }

  /* Mascot SVG */
  #mascot svg { display: block; }

  /* Tooltip bubble */
  #tooltip {
    position: fixed;
    background: white;
    border: 2.5px solid #81c784;
    border-radius: 18px 18px 18px 4px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    color: #2e7d32;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    z-index: 101;
    pointer-events: none;
    transition: opacity 0.3s;
    opacity: 0;
  }
  #tooltip.show { opacity: 1; }

  /* Chat window */
  #chatWindow {
    position: fixed;
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 0 1px #c8e6c9;
    width: 360px;
    max-height: 520px;
    display: flex;
    flex-direction: column;
    z-index: 99;
    overflow: hidden;
    transform: scale(0) translateY(20px);
    transform-origin: bottom left;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    opacity: 0;
  }
  #chatWindow.open {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .chat-header {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    padding: 16px 18px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .chat-header-avatar {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    border: 2px solid rgba(255,255,255,0.5);
  }
  .chat-header-info { flex: 1; }
  .chat-header-name {
    font-family: 'Fredoka One', cursive;
    font-size: 17px;
    color: white;
    letter-spacing: 0.3px;
  }
  .chat-header-status {
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    display: flex; align-items: center; gap: 5px;
  }
  .status-dot {
    width: 7px; height: 7px;
    background: #b9f6ca;
    border-radius: 50%;
    animation: statusPulse 2s infinite;
  }
  @keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .chat-close {
    background: rgba(255,255,255,0.2);
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    transition: background 0.2s;
  }
  .chat-close:hover { background: rgba(255,255,255,0.35); }

  /* Quick actions */
  .quick-actions {
    padding: 12px 14px 0;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    flex-shrink: 0;
    background: #f9fbe7;
    border-bottom: 1px solid #e8f5e9;
  }
  .quick-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 20px;
    border: 1.5px solid #a5d6a7;
    background: white;
    color: #388e3c;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
    white-space: nowrap;
  }
  .quick-btn:hover { background: #e8f5e9; border-color: #66bb6a; transform: translateY(-1px); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fafffe;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: #c8e6c9; border-radius: 10px; }

  .msg {
    display: flex;
    gap: 8px;
    animation: msgIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.bot .msg-avatar { background: #e8f5e9; border: 1.5px solid #a5d6a7; }
  .msg.user .msg-avatar { background: #e3f2fd; border: 1.5px solid #90caf9; }

  .msg-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    font-weight: 600;
  }
  .msg.bot .msg-bubble {
    background: white;
    border: 1.5px solid #e8f5e9;
    border-bottom-left-radius: 4px;
    color: #2e7d32;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(67,160,71,0.3);
  }

  /* Typing indicator */
  .typing-dots {
    display: flex; gap: 4px; align-items: center; padding: 4px 0;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    background: #81c784;
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  /* Input area */
  .chat-input-area {
    padding: 12px 14px;
    background: white;
    border-top: 1.5px solid #e8f5e9;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #userInput {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid #c8e6c9;
    border-radius: 18px;
    padding: 9px 14px;
    outline: none;
    resize: none;
    max-height: 80px;
    line-height: 1.4;
    color: #333;
    transition: border-color 0.2s;
  }
  #userInput:focus { border-color: #66bb6a; }
  #userInput::placeholder { color: #aaa; font-weight: 600; }

  #sendBtn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #43a047, #66bb6a);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 10px rgba(67,160,71,0.4);
  }
  #sendBtn:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(67,160,71,0.5); }
  #sendBtn:active { transform: scale(0.95); }
  #sendBtn svg { width: 18px; height: 18px; fill: white; }

  /* Drag hint */
  .drag-hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #81c784;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    pointer-events: none;
    z-index: 50;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Tooltip -->
<div id="tooltip">Hello, farmer! 🌾</div>

<!-- Mascot -->
<div id="mascot" title="Click to chat!">
  <svg width="90" height="110" viewBox="0 0 90 110" xmlns="http://www.w3.org/2000/svg">
    <!-- Hat brim -->
    <ellipse cx="45" cy="32" rx="34" ry="8" fill="#8B6914"/>
    <!-- Hat top -->
    <rect x="22" y="8" width="46" height="26" rx="8" fill="#A0792A"/>
    <!-- Hat band -->
    <rect x="22" y="28" width="46" height="6" rx="2" fill="#7a5c1a"/>
    <!-- Straw bits -->
    <line x1="10" y1="32" x2="2" y2="26" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="32" x2="88" y2="26" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="33" x2="7" y2="36" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="45" cy="52" rx="22" ry="22" fill="#FFCC80"/>
    <!-- Rosy cheeks -->
    <ellipse cx="32" cy="56" rx="6" ry="4" fill="#ffaaaa" opacity="0.55"/>
    <ellipse cx="58" cy="56" rx="6" ry="4" fill="#ffaaaa" opacity="0.55"/>
    <!-- Eyes -->
    <ellipse cx="38" cy="49" rx="3.5" ry="4" fill="#4a3000"/>
    <ellipse cx="52" cy="49" rx="3.5" ry="4" fill="#4a3000"/>
    <circle cx="39.5" cy="47.5" r="1.2" fill="white"/>
    <circle cx="53.5" cy="47.5" r="1.2" fill="white"/>
    <!-- Smile -->
    <path d="M 37 58 Q 45 65 53 58" stroke="#c0631a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="45" cy="55" rx="2.5" ry="2" fill="#e8a060"/>
    <!-- Body / overalls -->
    <rect x="24" y="70" width="42" height="36" rx="14" fill="#1565C0"/>
    <!-- Overalls straps -->
    <rect x="30" y="68" width="9" height="14" rx="4" fill="#1976D2"/>
    <rect x="51" y="68" width="9" height="14" rx="4" fill="#1976D2"/>
    <!-- Shirt collar / neck -->
    <ellipse cx="45" cy="70" rx="10" ry="5" fill="#FFCC80"/>
    <!-- Overalls pocket -->
    <rect x="38" y="80" width="14" height="10" rx="4" fill="#1976D2" stroke="#0d47a1" stroke-width="1"/>
    <!-- Hands -->
    <ellipse cx="18" cy="84" rx="8" ry="7" fill="#FFCC80"/>
    <ellipse cx="72" cy="84" rx="8" ry="7" fill="#FFCC80"/>
    <!-- Boots -->
    <ellipse cx="34" cy="106" rx="12" ry="6" fill="#5D4037"/>
    <ellipse cx="56" cy="106" rx="12" ry="6" fill="#5D4037"/>
    <!-- Tool in hand (hoe) -->
    <line x1="72" y1="82" x2="82" y2="55" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="84" cy="51" rx="6" ry="3" fill="#8B6914" transform="rotate(-30 84 51)"/>
  </svg>
</div>

<!-- Chat Window -->
<div id="chatWindow">
  <div class="chat-header">
    <div class="chat-header-avatar">🌾</div>
    <div class="chat-header-info">
      <div class="chat-header-name">Farmer Buddy</div>
      <div class="chat-header-status">
        <div class="status-dot"></div>
        Ready to help your farm!
      </div>
    </div>
    <button class="chat-close" id="closeBtn" title="Close">✕</button>
  </div>

  <div class="quick-actions" id="quickActions">
    <button class="quick-btn" data-q="What crops should I plant this season?">🌱 Crops</button>
    <button class="quick-btn" data-q="How do I deal with pests on my farm?">🐛 Pests</button>
    <button class="quick-btn" data-q="When should I water my plants?">💧 Watering</button>
    <button class="quick-btn" data-q="What fertilizers are best?">🌿 Fertilizer</button>
    <button class="quick-btn" data-q="Check weather suitability for farming today">🌤️ Weather</button>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="msg-avatar">🧑‍🌾</div>
      <div class="msg-bubble">Howdy farmer! 🌾 I'm Buddy, your farm assistant. Ask me anything about your crops, soil, pests, weather, or anything else on the farm!</div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea id="userInput" rows="1" placeholder="Ask about your farm…"></textarea>
    <button id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const mascot = document.getElementById('mascot');
  const chatWindow = document.getElementById('chatWindow');
  const closeBtn = document.getElementById('closeBtn');
  const messagesEl = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const tooltip = document.getElementById('tooltip');
  const quickActions = document.getElementById('quickActions');

  // Position mascot at bottom-left
  let mPos = {
  x: window.innerWidth - 120,
  y: window.innerHeight - 160
};
  let chatOpen = false;
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragOffset = { x: 0, y: 0 };
  let dragMoved = false;

  function positionMascot() {
    mascot.style.left = mPos.x + 'px';
    mascot.style.top = mPos.y + 'px';
  }
  function positionChat() {
    let cx = mPos.x + 100;
    let cy = mPos.y - 340;
    if (cx + 370 > window.innerWidth) cx = mPos.x - 370;
    if (cy < 10) cy = 10;
    chatWindow.style.left = cx + 'px';
    chatWindow.style.top = cy + 'px';
  }
  positionMascot();

  // Tooltip hints
  const tips = ['Ask me anything! 🌾', 'How are the crops? 🌱', 'Need farming tips? 🚜', 'Hello, farmer! 👋', 'Rain coming? ☔'];
  let tipIdx = 0;
  function showTip() {
    if (chatOpen) return;
    tooltip.textContent = tips[tipIdx++ % tips.length];
    tooltip.style.left = (mPos.x - 170) + 'px';
    tooltip.style.top = (mPos.y + 10) + 'px';
    tooltip.classList.add('show');
    setTimeout(() => tooltip.classList.remove('show'), 2500);
  }
  setTimeout(showTip, 3000);
  setInterval(showTip, 5000);

  // Dragging
  mascot.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragMoved = false;
    dragOffset.x = e.clientX - mPos.x;
    dragOffset.y = e.clientY - mPos.y;
    dragStart.x = e.clientX;
    dragStart.y = e.clientY;
    mascot.style.transition = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = Math.abs(e.clientX - dragStart.x);
    const dy = Math.abs(e.clientY - dragStart.y);
    if (dx > 4 || dy > 4) dragMoved = true;
    mPos.x = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - dragOffset.x));
    mPos.y = Math.max(0, Math.min(window.innerHeight - 120, e.clientY - dragOffset.y));
    positionMascot();
    if (chatOpen) positionChat();
    tooltip.classList.remove('show');
  });
  document.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    mascot.style.transition = 'transform 0.3s cubic-bezier(.34,1.56,.64,1)';
    if (!dragMoved) toggleChat();
  });

  // Touch drag
  mascot.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    isDragging = true; dragMoved = false;
    dragOffset.x = t.clientX - mPos.x;
    dragOffset.y = t.clientY - mPos.y;
    dragStart.x = t.clientX; dragStart.y = t.clientY;
    mascot.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const t = e.touches[0];
    const dx = Math.abs(t.clientX - dragStart.x);
    const dy = Math.abs(t.clientY - dragStart.y);
    if (dx > 4 || dy > 4) dragMoved = true;
    mPos.x = Math.max(0, Math.min(window.innerWidth - 100, t.clientX - dragOffset.x));
    mPos.y = Math.max(0, Math.min(window.innerHeight - 120, t.clientY - dragOffset.y));
    positionMascot();
    if (chatOpen) positionChat();
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    mascot.style.transition = 'transform 0.3s cubic-bezier(.34,1.56,.64,1)';
    if (!dragMoved) toggleChat();
  });

  function toggleChat() {
    chatOpen = !chatOpen;
    if (chatOpen) {
      positionChat();
      chatWindow.classList.add('open');
      mascot.classList.add('wiggle');
      setTimeout(() => mascot.classList.remove('wiggle'), 700);
      tooltip.classList.remove('show');
      setTimeout(() => userInput.focus(), 400);
    } else {
      chatWindow.classList.remove('open');
      mascot.classList.add('bounce');
      setTimeout(() => mascot.classList.remove('bounce'), 600);
    }
  }
  closeBtn.addEventListener('click', toggleChat);

  // Quick action buttons
  quickActions.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = btn.dataset.q;
      sendMessage(q);
    });
  });

  // Send message
  function sendMessage(text) {
    text = (text || userInput.value).trim();
    if (!text) return;
    userInput.value = '';
    userInput.style.height = 'auto';
    appendMsg('user', '👤', text);
    showTyping();
    callBackend(text);
  }

  sendBtn.addEventListener('click', () => sendMessage());
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 80) + 'px';
  });

  function appendMsg(type, avatar, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-bubble">${text}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let typingEl = null;
  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar">🧑‍🌾</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    typingEl = div;
  }
  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function callBackend(message) {
    try {
      const response = await fetch('/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({ message: message })
      });
      const data = await response.json();
      removeTyping();
      const reply = data.response || data.message || data.reply || 'I received your message!';
      appendMsg('bot', '🧑‍🌾', reply);
      mascot.classList.add('wiggle');
      setTimeout(() => mascot.classList.remove('wiggle'), 700);
    } catch (err) {
      removeTyping();
      appendMsg('bot', '🧑‍🌾', '⚠️ Oops! Couldn\'t reach the farm server. Check your connection.');
    }
  }

  function getCookie(name) {
    let v = null;
    if (document.cookie && document.cookie !== '') {
      document.cookie.split(';').forEach(c => {
        const kv = c.trim();
        if (kv.startsWith(name + '=')) v = decodeURIComponent(kv.substring(name.length + 1));
      });
    }
    return v;
  }
</script>
</body>
</html>
